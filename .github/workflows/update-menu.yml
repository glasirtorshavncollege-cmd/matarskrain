name: Dagfør matskrá

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update-menu:
    runs-on: ubuntu-latest

    steps:
      - name: Heinta repository
        uses: actions/checkout@v6

      - name: Set Python upp
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Legg Python-pakkar inn
        run: pip install -r requirements.txt

      - name: Koyr hardening-test
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Heinta matskránna
        run: python scripts/update_menu.py

      - name: Goym broytingar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Ongar broytingar."
          else
            git commit -m "Dagfør matskrá"
            git push
          fi
