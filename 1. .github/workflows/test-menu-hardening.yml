name: Test matskrá-hardening

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/update_menu.py'
      - 'tests/**'
      - '.github/workflows/update-menu.yml'
      - '.github/workflows/test-menu-hardening.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Heinta repository
        uses: actions/checkout@v6

      - name: Set Python upp
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Legg Python-pakkar inn
        run: pip install -r requirements.txt

      - name: Koyr test
        run: python -m unittest discover -s tests -p 'test_*.py' -v
